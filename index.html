<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Plants List</title>
  <meta name="description" content="Premium Fruit Plants List featuring high-quality fruit plants, exotic varieties, imported plants, gardening collections, and nursery plants.">
  <link rel="canonical" href="https://fruitplantslist.vercel.app/">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://fruitplantslist.vercel.app/">
  <meta property="og:site_name" content="Fruit Plants List">
  <meta property="og:title" content="Fruit Plants List — Premium Quality Plants">
  <meta property="og:description" content="203+ premium fruit plant varieties — imported, exotic &amp; best-seller collections. Hand-picked for quality.">
  <meta property="og:image" content="https://fruitplantslist.vercel.app/assets/og-banner.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://fruitplantslist.vercel.app/">
  <meta name="twitter:title" content="Fruit Plants List — Premium Quality Plants">
  <meta name="twitter:description" content="203+ premium fruit plant varieties — imported, exotic &amp; best-seller collections. Hand-picked for quality.">
  <meta name="twitter:image" content="https://fruitplantslist.vercel.app/assets/og-banner.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Fruit Plants List",
    "url": "https://fruitplantslist.vercel.app/",
    "description": "Premium Fruit Plants List featuring high-quality fruit plants, exotic varieties, imported plants, gardening collections, and nursery plants.",
    "publisher": {
      "@type": "Organization",
      "name": "Fruit Plants List",
      "logo": {
        "@type": "ImageObject",
        "url": "https://fruitplantslist.vercel.app/assets/logo.png"
      }
    }
  }
  </script>

  <link rel="stylesheet" href="index.css">
  <link rel="icon" type="image/png" href="image copy 104.png">
</head>
<body>

  <!-- ═══ PLANTS ═══ -->
  <section id="plants">
    <div class="plants-hero">
      <h2 class="plants-hero-title letter-animate" id="plantsHeading">Plant Collections</h2>
      <p class="plants-hero-desc">203+ premium fruit plant varieties — hand-picked for quality</p>
    </div>
    <div class="plants-grid-section">
      <div class="container">
        <div class="plants-controls fade-in">
          <div class="plants-search">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search plants...">
          </div>
          <div class="plants-filter" id="plantsFilter">
            <button class="filter-btn active" data-filter="all" id="filter-all">All Plants</button>
            <button class="filter-btn" data-filter="imported" id="filter-imported">⭐ Imported</button>
            <button class="filter-btn" data-filter="exotic" id="filter-exotic">🌍 Exotic</button>
            <button class="filter-btn" data-filter="bestseller" id="filter-bestseller">🌿 Best Sellers</button>
          </div>
        </div>
        <div class="plants-grid" id="plantsGrid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </section>

  <!-- ═══ PLANT DETAIL MODAL ═══ -->
  <div class="plant-modal" id="plantModal">
    <div class="plant-modal-content">
      <div class="modal-image-wrap">
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
        <img id="modalImage" src="" alt="">
      </div>
      <div class="modal-info">
        <h3 class="modal-plant-name" id="modalName"></h3>
        <p class="modal-origin" id="modalOrigin"></p>
        <div class="modal-detail-row">
          <span class="modal-detail-label">Category</span>
          <span class="modal-detail-value" id="modalCategory"></span>
        </div>
        <div class="modal-detail-row">
          <span class="modal-detail-label">Type</span>
          <span class="modal-detail-value" id="modalType"></span>
        </div>
        <div class="modal-detail-row">
          <span class="modal-detail-label">Origin</span>
          <span class="modal-detail-value" id="modalOriginDetail"></span>
        </div>
        <div class="modal-description">
          <h4>Description</h4>
          <p id="modalDesc"></p>
        </div>
        <a class="btn btn-whatsapp modal-whatsapp" id="modalWhatsApp" href="#" target="_blank">💬 Enquire on WhatsApp</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
